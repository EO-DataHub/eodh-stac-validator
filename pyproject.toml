[project]
name = "eodh-stac-validator"
version = "0.1.0"
description = "A validator API for STAC files, returning errors and best practice suggestions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "stac-check",
    "urllib3",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]
